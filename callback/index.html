<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Authorization</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #12100e; color: #f2e9d8; line-height: 1.7; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
    h1 { color: #f7d88f; font-size: 1.6rem; }
    code { display: block; background: #262119; padding: 14px 16px; border-radius: 10px;
           word-break: break-all; font-size: .95rem; margin-top: 12px; color: #f7d88f; }
    .muted { color: #b8ab93; }
  </style>
</head>
<body>
  <main>
    <h1>TikTok Authorization</h1>
    <p class="muted">Copy the authorization code below and send it back to the assistant.</p>
    <code id="code">…</code>
    <p id="note" class="muted"></p>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('code');
    document.getElementById('code').textContent = code || '(no code parameter in the URL)';
    if (p.get('error')) document.getElementById('note').textContent = 'Error: ' + p.get('error') + ' ' + (p.get('error_description') || '');
  </script>
</body>
</html>
